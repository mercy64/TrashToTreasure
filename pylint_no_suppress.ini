[MASTER]
load-plugins = pylint_django
init-hook = import sys, os; sys.path.insert(0, os.path.join(os.getcwd(), "backend")); os.environ.setdefault("DJANGO_SETTINGS_MODULE", "trashtrotreasure.settings"); import django; django.setup()
ignore = migrations

[MESSAGES CONTROL]
# no global suppressions here; we want to see E0401/E1101

[FORMAT]
max-line-length = 120

[REPORTS]
score = no
output-format = text
